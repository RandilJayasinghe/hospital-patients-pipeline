# =============================================================================
# EC8203 Applied Big Data Engineering -- Hospital Vital Signs (Lambda arch.)
#
# Service groups (see docs/architecture.md):
#   Foundation : kafka, kafka-init, kafka-ui, postgres, prometheus,
#                alertmanager, grafana
#   Ingestion  : vitals-producer (stream source), lab-producer (daily batch
#                source), spark-archiver (Kafka -> Parquet master dataset)
#   Speed layer: spark-stream
#   Batch layer: airflow-init, airflow-webserver, airflow-scheduler
#   Serving    : api
#
# Run `cp .env.example .env && docker compose up -d --build`.
# See README.md for setup, ports and troubleshooting.
# =============================================================================

networks:
  bigdata_net:
    driver: bridge

volumes:
  kafka_data:
  postgres_data:
  grafana_data:
  airflow_logs:

services:

  # ===========================================================================
  # PHASE 1 — Foundation & Infrastructure
  # ===========================================================================

  kafka:
    image: apache/kafka:3.9.1
    # No fixed container_name: a hard-coded "kafka" collides with any other
    # project's container of that name. Other services reach the broker via the
    # compose service name / hostname "kafka" on the shared network.
    hostname: kafka
    restart: unless-stopped
    ports:
      - "29092:29092"   # external listener, for host tools (kafka-ui talks internally though)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"   # laptop-sized broker heap
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-e1HBZ7LpS_q5zP3Zpcr3TQ}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - bigdata_net

  kafka-init:
    image: apache/kafka:3.9.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        BS=kafka:9092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --create --if-not-exists \
            --topic "$$1" --partitions "$$2" --replication-factor 1
        }
        create "${TOPIC_VITALS_RAW:-vitals_raw}" "${TOPIC_VITALS_RAW_PARTITIONS:-3}"
        create "${TOPIC_LAB_BATCH:-lab_batch}" "${TOPIC_LAB_BATCH_PARTITIONS:-1}"
        create "${TOPIC_VITALS_CLEAN:-vitals_clean}" "${TOPIC_VITALS_CLEAN_PARTITIONS:-3}"
        create "${TOPIC_CLINICAL_ALERTS:-clinical_alerts}" "${TOPIC_CLINICAL_ALERTS_PARTITIONS:-1}"
        create "${TOPIC_VITALS_DLQ:-vitals_dlq}" "${TOPIC_VITALS_DLQ_PARTITIONS:-1}"
        echo "Topics created:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server $$BS --list
    environment:
      TOPIC_VITALS_RAW: ${TOPIC_VITALS_RAW:-vitals_raw}
      TOPIC_VITALS_RAW_PARTITIONS: ${TOPIC_VITALS_RAW_PARTITIONS:-3}
      TOPIC_LAB_BATCH: ${TOPIC_LAB_BATCH:-lab_batch}
      TOPIC_LAB_BATCH_PARTITIONS: ${TOPIC_LAB_BATCH_PARTITIONS:-1}
      TOPIC_VITALS_CLEAN: ${TOPIC_VITALS_CLEAN:-vitals_clean}
      TOPIC_VITALS_CLEAN_PARTITIONS: ${TOPIC_VITALS_CLEAN_PARTITIONS:-3}
      TOPIC_CLINICAL_ALERTS: ${TOPIC_CLINICAL_ALERTS:-clinical_alerts}
      TOPIC_CLINICAL_ALERTS_PARTITIONS: ${TOPIC_CLINICAL_ALERTS_PARTITIONS:-1}
      TOPIC_VITALS_DLQ: ${TOPIC_VITALS_DLQ:-vitals_dlq}
      TOPIC_VITALS_DLQ_PARTITIONS: ${TOPIC_VITALS_DLQ_PARTITIONS:-1}
    networks:
      - bigdata_net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      JAVA_OPTS: "-Xms128m -Xmx384m"
    networks:
      - bigdata_net

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB_VITALS:-vitals}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB_VITALS:-vitals}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bigdata_net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    networks:
      - bigdata_net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - bigdata_net

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"   # Windows may reserve 3000 (see README troubleshooting)
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # Mounted OUTSIDE /etc/grafana/provisioning: nesting a mount inside the read-only
      # provisioning mount makes Docker fail with "read-only file system".
      - ./observability/grafana/dashboards:/var/lib/grafana-dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - bigdata_net

  # ===========================================================================
  # PHASE 2 — Ingestion Layer
  # ===========================================================================

  vitals-producer:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: vitals-producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["-u", "ingestion/vitals_producer.py"]
    env_file: .env
    environment:
      DATA_ROOT: /data
      LOGS_DIR: /data/logs
      PATIENTS_CSV: /app/config/patients.csv
    ports:
      - "8001:8001"   # Prometheus metrics
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./ingestion:/app/ingestion:ro
      - ./data:/data
    networks:
      - bigdata_net

  lab-producer:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: lab-producer
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["-u", "ingestion/lab_batch_producer.py"]
    env_file: .env
    environment:
      DATA_ROOT: /data
      LOGS_DIR: /data/logs
      PATIENTS_CSV: /app/config/patients.csv
      LANDING_LABS_DIR: /data/landing/labs
    ports:
      - "8002:8002"   # Prometheus metrics
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./ingestion:/app/ingestion:ro
      - ./data:/data
    networks:
      - bigdata_net

  spark-archiver:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: spark-archiver
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["/opt/app/processing/raw_archiver.py"]
    env_file: .env
    environment:
      DATA_ROOT: /data
      LOGS_DIR: /data/logs
      MASTER_VITALS_DIR: /data/master/vitals
      CHECKPOINT_ARCHIVER_DIR: /data/checkpoints/archiver
    volumes:
      - ./common:/opt/app/common:ro
      - ./config:/opt/app/config:ro
      - ./processing:/opt/app/processing:ro
      - ./ingestion:/opt/app/ingestion:ro
      - ./data:/data
    networks:
      - bigdata_net

  # ===========================================================================
  # PHASE 3 — Speed Layer
  # ===========================================================================

  spark-stream:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    container_name: spark-stream
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    command: ["/opt/app/processing/stream_job.py"]
    env_file: .env
    environment:
      DATA_ROOT: /data
      LOGS_DIR: /data/logs
      CHECKPOINT_STREAM_DIR: /data/checkpoints/stream
      PATIENTS_CSV: /opt/app/config/patients.csv
    ports:
      - "4040:4040"   # Spark UI / metrics
    volumes:
      - ./common:/opt/app/common:ro
      - ./config:/opt/app/config:ro
      - ./processing:/opt/app/processing:ro
      - ./ingestion:/opt/app/ingestion:ro
      - ./data:/data
    networks:
      - bigdata_net

  # ===========================================================================
  # PHASE 4 — Batch Layer + Airflow Orchestration
  # ===========================================================================

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Data --lastname Engineer \
          --role Admin --email admin@example.com || true
    user: "${AIRFLOW_UID:-50000}:0"
    env_file: .env
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB_AIRFLOW:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__WORKERS: "1"            # default 4 gunicorn workers ~ +1 GB RAM
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      # FileSensor (wait_for_lab_file) needs a "fs_default" connection; defining it
      # here keeps the "zero manual Airflow UI setup" promise.
      AIRFLOW_CONN_FS_DEFAULT: '{"conn_type": "fs", "extra": {"path": "/"}}'
      AIRFLOW__CORE__FERNET_KEY: ""
      DATA_ROOT: /data
      LOGS_DIR: /data/logs
      LANDING_LABS_DIR: /data/landing/labs
      MASTER_VITALS_DIR: /data/master/vitals
      REPORTS_DIR: /data/reports
      QUARANTINE_DIR: /data/quarantine
      PATIENTS_CSV: /opt/airflow/project/config/patients.csv
    volumes: &airflow-common-volumes
      - airflow_logs:/opt/airflow/logs
      - ./orchestration/dags:/opt/airflow/dags
      - ./common:/opt/airflow/project/common:ro
      - ./config:/opt/airflow/project/config:ro
      - ./processing:/opt/airflow/project/processing:ro
      - ./ingestion:/opt/airflow/project/ingestion:ro
      - ./serving:/opt/airflow/project/serving:ro
      - ./data:/data
    networks:
      - bigdata_net

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["webserver"]
    user: "${AIRFLOW_UID:-50000}:0"
    env_file: .env
    environment: *airflow-common-env
    ports:
      - "8081:8080"
    volumes: *airflow-common-volumes
    networks:
      - bigdata_net

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    container_name: airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: ["scheduler"]
    user: "${AIRFLOW_UID:-50000}:0"
    env_file: .env
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    networks:
      - bigdata_net

  # ===========================================================================
  # PHASE 5 — Serving API
  # ===========================================================================

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["-m", "uvicorn", "serving.api:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATA_ROOT: /data
      LOGS_DIR: /data/logs
      REPORTS_DIR: /data/reports
    ports:
      - "8000:8000"
    volumes:
      - ./common:/app/common:ro
      - ./config:/app/config:ro
      - ./serving:/app/serving:ro
      - ./data:/data
    networks:
      - bigdata_net
